<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>metaSchool</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      color: #a1a1aa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="logo">metaSchool</div>
  <div class="spinner"></div>
  <div class="status" id="status">Εκκίνηση συστήματος...</div>
  <script>
    let attempts = 0;
    async function checkServer() {
      attempts++;
      try {
        const res = await fetch("http://127.0.0.1:3000/api/timetable", { cache: "no-store", mode: "no-cors" });
        // If the promise resolves, the server is up (even if opaque due to CORS)
        window.location.replace("http://127.0.0.1:3000");
        return;
      } catch (e) {
        if (attempts > 15) {
          document.getElementById("status").innerText = "Εκκίνηση βάσης δεδομένων και solver...";
        }
      }
      setTimeout(checkServer, 300);
    }
    checkServer();
  </script>
</body>
</html>
