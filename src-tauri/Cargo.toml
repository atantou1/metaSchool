[package]
name = "metaschool"
version = "1.0.0"
description = "metaSchool - School Timetable Generator"
authors = ["metaSchool Team"]
edition = "2021"

[lib]
name = "metaschool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
