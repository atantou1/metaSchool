name: Build Windows App (Tauri)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Python: Build backend sidecar ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps & build sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python backend/build_sidecar.py
          echo "--- Sidecar binaries ---"
          dir src-tauri\binaries

      # ── 2. Node: Build Next.js frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps & build
        working-directory: frontend
        run: |
          npm install
          npm run build

      # ── 3. Node: Install root Tauri CLI ──
      - name: Install root Tauri CLI
        run: |
          npm install
          echo "--- Root node_modules check ---"
          npx tauri --version

      # ── 4. Rust: Compile Tauri app ──
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri app
        run: |
          npx tauri build --verbose 2>&1

      # ── 5. List outputs for debugging ──
      - name: List build outputs
        if: always()
        shell: bash
        run: |
          echo "=== release dir ==="
          ls -la src-tauri/target/release/ 2>/dev/null || echo "no release dir"
          echo "=== nsis bundles ==="
          ls -la src-tauri/target/release/bundle/nsis/ 2>/dev/null || echo "no nsis dir"
          echo "=== msi bundles ==="
          ls -la src-tauri/target/release/bundle/msi/ 2>/dev/null || echo "no msi dir"

      # ── 6. Upload installer ──
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: metaSchool-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # ── 7. Release (only on tag push) ──
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
