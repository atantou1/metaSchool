name: Build Windows App (Tauri)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    tags:
      - 'v*' # Triggers on release tags like v1.0.0

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Python & Compile Backend Sidecar
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar (.exe)
        run: |
          if (!(Test-Path -Path "src-tauri\binaries")) { New-Item -ItemType Directory -Path "src-tauri\binaries" -Force }
          pyinstaller --noconfirm --onefile --noconsole `
            --name backend-x86_64-pc-windows-msvc `
            --collect-all ortools `
            --collect-all uvicorn `
            --collect-all fastapi `
            backend/run_server.py `
            --distpath src-tauri/binaries `
            --workpath backend/build `
            --specpath backend

      # 2. Setup Node.js & Install Frontend Dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # 3. Setup Rust Toolchain & Build Tauri App
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri Desktop App
        working-directory: frontend
        run: npx @tauri-apps/cli build

      # 4. Upload Installer Artifacts
      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: metaSchool-Windows-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      # 5. Create GitHub Release (if triggered by a tag)
      - name: Create Release & Attach Installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
