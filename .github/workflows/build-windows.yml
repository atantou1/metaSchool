name: Build Windows App (Tauri)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    tags:
      - 'v*' # Triggers on release tags like v1.0.0

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Python & Compile Backend Sidecar
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build Python Sidecar (.exe)
        run: |
          python backend/build_sidecar.py

      # 2. Setup Node.js & Build Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Frontend
        run: |
          npm install
          cd frontend
          npm install
          npm run build
          cd ..

      # 3. Setup Rust Toolchain & Build Tauri App
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri Desktop App
        run: |
          npm run tauri build -- --verbose

      # 4. Upload Installer Artifacts
      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: metaSchool-Windows-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe

      # 5. Create GitHub Release (if triggered by a tag)
      - name: Create Release & Attach Installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
